<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>嘴巴張開紀錄器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #161a20;
      --line: #2a313b;
      --text: #f4f7fb;
      --muted: #aab4c2;
      --ok: #35d07f;
      --warn: #ffb84d;
      --danger: #ff5f67;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      margin: 4px 0 14px;
      font-size: clamp(24px, 5vw, 34px);
    }
    .camera-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #000;
      aspect-ratio: 3 / 4;
      max-height: 68vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    video.front {
      transform: scaleX(-1);
    }

    .ratio-bar {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      height: 28px;
      border-radius: 999px;
      overflow: hidden;
      background: #27c76f;
      border: 2px solid rgba(255,255,255,.9);
      z-index: 5;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .ratio-red {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #ef4444;
      transition: width .15s linear;
    }
    .ratio-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
      pointer-events: none;
    }

    .badge-row {
      position: absolute;
      inset: 50px 12px auto 12px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      pointer-events: none;
    }
    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(8px);
      font-size: 14px;
      font-weight: 700;
    }
    .badge.open { color: #93ffbd; }
    .badge.closed { color: #fff; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      align-items: stretch;
    }
    .jaw-row {
      margin-top: 8px;
    }
    .jaw-control {
      background: #151b22;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .jaw-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .jaw-label strong {
      color: #fff;
      font-size: 12px;
    }
    #jawSlider {
      width: 100%;
      accent-color: var(--warn);
      cursor: pointer;
      height: 18px;
    }
    button, a.download {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    #startBtn { background: var(--ok); color: #07160e; }
    #startBtn.stop { background: var(--danger); color: white; }
    #switchBtn { background: #2a3340; color: white; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: #0f1318;
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }
    .stat .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .stat .value {
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .status {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.5;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .shot {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #0f1318;
    }
    .shot img { width: 100%; display: block; }
    .shot .caption { padding: 8px; font-size: 12px; color: var(--muted); }
    .result {
      display: none;
      margin-top: 12px;
    }
    .result.show { display: block; }
    .result video {
      width: 100%;
      max-height: 60vh;
      border-radius: 14px;
      background: #000;
      transform: none;
    }
    .download-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    a.download { background: #fff; color: #111; }

    .duration-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .duration-controls button {
      padding: 9px 4px;
      font-size: 12px;
      white-space: nowrap;
    }
    .duration-btn, #viewRecordsBtn {
      background: #222933;
      color: white;
      border: 1px solid var(--line);
    }
    .duration-btn.active {
      background: var(--warn);
      color: #211500;
      border-color: transparent;
    }
    .duration-btn:disabled {
      opacity: .45;
    }
    @media (max-width: 420px) {
      .app {
        padding: 10px;
      }
      .duration-controls {
        gap: 4px;
      }
      .duration-controls button {
        padding: 8px 2px;
        font-size: 11px;
      }
      .controls {
        gap: 6px;
      }
      .controls button {
        font-size: 12px;
        padding: 9px 6px;
      }
      .badge {
        font-size: 12px;
        padding: 6px 8px;
      }
      .ratio-label {
        font-size: 12px;
      }
    }

    .records-panel {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 14px;
    }
    .records-panel.show {
      display: block;
    }
    .records-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .records-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .records-summary {
      color: var(--muted);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .records-table-wrap {
      overflow-x: auto;
    }
    .records-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }
    .records-table th,
    .records-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    .records-table th {
      color: var(--muted);
      font-weight: 700;
    }
    .thumb {
      width: 96px;
      border-radius: 8px;
      display: block;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="camera-wrap">
      <div id="ratioBar" class="ratio-bar" aria-label="張嘴閉嘴比例">
        <div id="ratioRed" class="ratio-red"></div>
        <div id="ratioLabel" class="ratio-label">閉嘴 100.0%</div>
      </div>
      <video id="camera" autoplay playsinline muted></video>
      <div class="badge-row">
        <div id="mouthBadge" class="badge closed">嘴巴：未偵測</div>
        <div id="scoreBadge" class="badge">jawOpen --</div>
      </div>
    </section>

    <div class="duration-controls">
      <button class="duration-btn active" data-minutes="3">3 分鐘</button>
      <button class="duration-btn" data-minutes="5">5 分鐘</button>
      <button class="duration-btn" data-minutes="10">10 分鐘</button>
      <button id="viewRecordsBtn">檢視</button>
    </div>

    <div class="jaw-row">
      <div class="jaw-control">
        <div class="jaw-label">
          <span>JawOpen</span>
          <strong id="jawValue">0.10</strong>
        </div>
        <input
          id="jawSlider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.10"
          aria-label="JawOpen 門檻"
        />
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">開始</button>
      <button id="switchBtn">切換前 / 後鏡頭</button>
    </div>

    <section class="panel">
      <div class="stats">
        <div class="stat">
          <div class="label">記錄時間</div>
          <div id="recordTime" class="value">00:00</div>
        </div>
        <div class="stat">
          <div class="label">張開總秒數</div>
          <div id="openTotal" class="value">0.00</div>
        </div>
        <div class="stat">
          <div class="label">張開次數</div>
          <div id="openCount" class="value">0</div>
        </div>
      </div>

      <div id="status" class="status">正在載入 MediaPipe…</div>
      <div id="gallery" class="gallery"></div>
    </section>

    <section id="recordsPanel" class="records-panel">
      <div class="records-header">
        <h2>目前記錄</h2>
        <button id="closeRecordsBtn">關閉</button>
      </div>
      <div id="recordsSummary" class="records-summary"></div>
      <div class="records-table-wrap">
        <table class="records-table">
          <thead>
            <tr>
              <th>#</th>
              <th>張開時間</th>
              <th>閉上時間</th>
              <th>張開秒數</th>
              <th>照片</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="result" class="panel result">
      <h2>本次短影片</h2>
      <video id="resultVideo" controls playsinline></video>
      <div id="videoSummary" class="status"></div>
      <div class="download-row">
        <a id="downloadVideo" class="download" href="#" download>下載影片</a>
      </div>
      <div class="note">
        影片格式會依瀏覽器支援自動選擇 MP4 或 WebM。每張照片停留 1 秒。
      </div>
    </section>

    <canvas id="workCanvas" hidden></canvas>
    <canvas id="videoCanvas" hidden></canvas>
  </main>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

    const $ = (s) => document.querySelector(s);

    const camera = $("#camera");
    const ratioBar = $("#ratioBar");
    const ratioRed = $("#ratioRed");
    const ratioLabel = $("#ratioLabel");
    const startBtn = $("#startBtn");
    const switchBtn = $("#switchBtn");
    const jawSlider = $("#jawSlider");
    const jawValue = $("#jawValue");
    const mouthBadge = $("#mouthBadge");
    const scoreBadge = $("#scoreBadge");
    const recordTimeEl = $("#recordTime");
    const openTotalEl = $("#openTotal");
    const openCountEl = $("#openCount");
    const statusEl = $("#status");
    const gallery = $("#gallery");
    const result = $("#result");
    const durationButtons = [...document.querySelectorAll(".duration-btn")];
    const viewRecordsBtn = $("#viewRecordsBtn");
    const recordsPanel = $("#recordsPanel");
    const closeRecordsBtn = $("#closeRecordsBtn");
    const recordsSummary = $("#recordsSummary");
    const recordsBody = $("#recordsBody");
    const resultVideo = $("#resultVideo");
    const videoSummary = $("#videoSummary");
    const downloadVideo = $("#downloadVideo");
    const workCanvas = $("#workCanvas");
    const videoCanvas = $("#videoCanvas");

    // 需求：「超過一半算張開」
    // MediaPipe jawOpen 分數高於目前滑桿門檻時，視為嘴巴張開。
    let OPEN_THRESHOLD = 0.10;

    const MEDIAPIPE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    // 為避免臨界值抖動造成重複觸發，狀態需維持一小段時間才確認。
    const STABLE_MS = 180;

    let faceLandmarker = null;
    let stream = null;
    let facingMode = "user"; // 預設前鏡頭；user = 前鏡頭, environment = 後鏡頭
    let firstCameraStart = true;
    let detecting = false;
    let lastVideoTime = -1;

    let isRecording = false;
    let recordStartPerf = 0;
    let recordEndPerf = 0;
    let timerId = null;
    let autoStopTimerId = null;
    let selectedDurationMinutes = 3;

    let mouthConfirmedOpen = false;
    let pendingState = null;
    let pendingSince = 0;

    let currentOpenEpisode = null;
    let episodes = [];
    let openTotalSeconds = 0;
    let lastRatioSamplePerf = 0;
    let accumulatedOpenMs = 0;

    let videoObjectUrl = null;

    function updateRatioBar(perfNow = performance.now()) {
      if (!isRecording || !recordStartPerf) {
        ratioRed.style.width = "0%";
        ratioLabel.textContent = "閉嘴 100.0%";
        return;
      }

      const elapsedMs = Math.max(1, perfNow - recordStartPerf);

      if (lastRatioSamplePerf > 0) {
        const delta = Math.max(0, perfNow - lastRatioSamplePerf);
        if (mouthConfirmedOpen) {
          accumulatedOpenMs += delta;
        }
      }
      lastRatioSamplePerf = perfNow;

      const openRatio = Math.min(1, accumulatedOpenMs / elapsedMs);
      const closedRatio = Math.max(0, 1 - openRatio);

      ratioRed.style.width = `${(openRatio * 100).toFixed(2)}%`;
      ratioLabel.textContent = `閉嘴 ${(closedRatio * 100).toFixed(1)}%`;
    }

    function fmtMMSS(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function fmtSec(seconds) {
      return Number(seconds).toFixed(2);
    }

    function nowRelativeSeconds(perf = performance.now()) {
      return isRecording
        ? (perf - recordStartPerf) / 1000
        : Math.max(0, (recordEndPerf - recordStartPerf) / 1000);
    }

    function beep(durationMs = 180, frequency = 880) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs / 1000);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + durationMs / 1000 + 0.03);
        osc.onended = () => ctx.close();
      } catch (e) {
        console.warn("beep failed", e);
      }
    }

    function updateDurationButtons() {
      durationButtons.forEach(btn => {
        const mins = Number(btn.dataset.minutes);
        btn.classList.toggle("active", mins === selectedDurationMinutes);
        btn.disabled = isRecording;
      });
    }

    function renderRecords() {
      const totalRecordSec = isRecording
        ? (performance.now() - recordStartPerf) / 1000
        : Math.max(0, (recordEndPerf - recordStartPerf) / 1000);

      const effectiveOpen = openTotalSeconds + (
        isRecording && currentOpenEpisode
          ? Math.max(0, (performance.now() - currentOpenEpisode.startPerf) / 1000)
          : 0
      );

      recordsSummary.textContent =
        `偵測設定：${selectedDurationMinutes} 分鐘｜目前記錄時間：${fmtMMSS(totalRecordSec)}｜` +
        `已完成張開事件：${episodes.length} 次｜累計張開：約 ${fmtSec(effectiveOpen)} 秒`;

      recordsBody.innerHTML = "";

      episodes.forEach((ep, index) => {
        const tr = document.createElement("tr");

        const img = document.createElement("img");
        img.className = "thumb";
        img.src = ep.finalCanvas.toDataURL("image/jpeg", 0.82);

        const photoTd = document.createElement("td");
        photoTd.appendChild(img);

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${fmtMMSS(ep.startSec)}</td>
          <td>${fmtMMSS(ep.endSec)}</td>
          <td>${fmtSec(ep.duration)} 秒</td>
        `;
        tr.appendChild(photoTd);
        recordsBody.appendChild(tr);
      });

      if (currentOpenEpisode) {
        const tr = document.createElement("tr");
        const currentSec = Math.max(
          0,
          (performance.now() - currentOpenEpisode.startPerf) / 1000
        );
        tr.innerHTML = `
          <td>${episodes.length + 1}</td>
          <td>${fmtMMSS(currentOpenEpisode.startSec)}</td>
          <td>尚未閉上</td>
          <td>${fmtSec(currentSec)} 秒（進行中）</td>
          <td>已拍攝，閉上後完成標註</td>
        `;
        recordsBody.appendChild(tr);
      }

      if (!episodes.length && !currentOpenEpisode) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="5">目前尚無嘴巴張開記錄。</td>`;
        recordsBody.appendChild(tr);
      }
    }

    async function initMediaPipe() {
      try {
        statusEl.textContent = "1/4 正在檢查 MediaPipe 模型…";

        // 先確認模型 URL 在目前部署環境可直接取得。
        // GitHub Pages 本身使用 HTTPS，因此跨來源載入 Google Storage / jsDelivr 是可行的。
        const modelResponse = await fetch(MEDIAPIPE_MODEL_URL, {
          method: "GET",
          cache: "force-cache"
        });

        if (!modelResponse.ok) {
          throw new Error(
            `模型下載失敗：HTTP ${modelResponse.status} ${modelResponse.statusText}`
          );
        }

        // 不必把整個模型留在 JS 記憶體中；讀少量資訊後讓 MediaPipe 自己依 URL 載入。
        const modelSize = Number(modelResponse.headers.get("content-length")) || 0;
        statusEl.textContent =
          `2/4 模型可取得${modelSize ? `（約 ${(modelSize / 1024 / 1024).toFixed(1)} MB）` : ""}，正在載入 WASM…`;

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
        );

        const commonOptions = {
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true,
          minFaceDetectionConfidence: 0.5,
          minFacePresenceConfidence: 0.25,
          minTrackingConfidence: 0.25
        };

        statusEl.textContent = "3/4 正在初始化 Face Landmarker（CPU）…";

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: MEDIAPIPE_MODEL_URL,
              delegate: "CPU"
            },
            ...commonOptions
          });
        } catch (cpuError) {
          console.warn("CPU 初始化失敗，改用 GPU：", cpuError);
          statusEl.textContent = "CPU 初始化失敗，改用 GPU…";

          faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: MEDIAPIPE_MODEL_URL,
              delegate: "GPU"
            },
            ...commonOptions
          });
        }

        statusEl.textContent = "4/4 MediaPipe 模型初始化成功，正在開啟相機…";

        await startCamera();

        statusEl.textContent =
          "MediaPipe 已就緒。可按 3 / 5 / 10 分鐘開始；jawOpen 會即時顯示。若 blendshape 中斷，會自動改用嘴唇 landmarks（顯示 · L）。";

        if (!detecting) {
          detecting = true;
          requestAnimationFrame(detectLoop);
        }
      } catch (err) {
        console.error("MediaPipe init failed:", err);

        const msg = err?.message ? String(err.message) : String(err);
        statusEl.textContent =
          `MediaPipe 初始化失敗：${msg}。請開啟瀏覽器開發者工具 Console 查看詳細錯誤。`;

        scoreBadge.textContent = "jawOpen --";
        mouthBadge.textContent = "模型未就緒";
        mouthBadge.className = "badge closed";
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("瀏覽器不支援 getUserMedia");
      }

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      let constraints;

      // 第一次啟動時明確要求前鏡頭。
      // 某些手機不接受 exact:user，因此失敗時再退回 ideal:user。
      if (firstCameraStart && facingMode === "user") {
        constraints = {
          audio: false,
          video: {
            facingMode: { exact: "user" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
      } else {
        constraints = {
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        // exact:user 在部分裝置可能失敗，改用較寬鬆的 ideal:user。
        if (firstCameraStart && facingMode === "user") {
          console.warn("無法用 exact:user 取得前鏡頭，改用 ideal:user：", err);
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "user" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } else {
          throw err;
        }
      }

      firstCameraStart = false;

      camera.srcObject = stream;
      await camera.play();

      const track = stream.getVideoTracks()[0];
      const settings = track?.getSettings?.() || {};
      const actualFacing = settings.facingMode || facingMode;

      // 根據實際相機設定決定是否鏡像。
      camera.classList.toggle("front", actualFacing === "user");

      console.log("Camera settings:", settings);

      if (statusEl.textContent.includes("MediaPipe")) {
        statusEl.textContent =
          `MediaPipe 已就緒。目前鏡頭：${actualFacing === "user" ? "前鏡頭" : actualFacing === "environment" ? "後鏡頭" : "未知"}。`;
      }
    }

    async function switchCamera() {
      switchBtn.disabled = true;
      try {
        facingMode = facingMode === "user" ? "environment" : "user";
        firstCameraStart = false;
        await startCamera();
        lastVideoTime = -1;
      } catch (err) {
        console.error(err);
        facingMode = facingMode === "user" ? "environment" : "user";
        statusEl.textContent = "切換鏡頭失敗，可能只有一個可用鏡頭。";
      } finally {
        switchBtn.disabled = false;
      }
    }

    function getJawOpenScore(result) {
      const categories = result?.faceBlendshapes?.[0]?.categories;

      if (Array.isArray(categories) && categories.length > 0) {
        const jaw =
          categories.find(c => c?.categoryName === "jawOpen") ||
          categories.find(c => c?.displayName === "jawOpen") ||
          categories.find(c => Number(c?.index) === 25) ||
          categories[25];

        const score = Number(jaw?.score);
        if (Number.isFinite(score)) {
          return { score, source: "blendshape" };
        }
      }

      // 備援：若 blendshape 暫時沒有輸出，但 landmarks 還存在，
      // 用嘴唇內側上下距離 / 嘴角寬度估算開口程度。
      // landmarks: 13=上唇內側, 14=下唇內側, 78/308=左右嘴角附近。
      const lm = result?.faceLandmarks?.[0];
      if (Array.isArray(lm) && lm.length > 308) {
        const upper = lm[13];
        const lower = lm[14];
        const left = lm[78];
        const right = lm[308];

        if (upper && lower && left && right) {
          const vertical = Math.hypot(
            (upper.x ?? 0) - (lower.x ?? 0),
            (upper.y ?? 0) - (lower.y ?? 0)
          );
          const width = Math.hypot(
            (left.x ?? 0) - (right.x ?? 0),
            (left.y ?? 0) - (right.y ?? 0)
          );

          if (width > 0) {
            // 約 0.35 的口高/口寬視為接近完全張開，轉成 0~1。
            const normalized = Math.max(0, Math.min(1, (vertical / width) / 0.35));
            return { score: normalized, source: "landmark" };
          }
        }
      }

      return null;
    }

    function updateMouthState(rawOpen, perfNow) {
      const desired = rawOpen ? "open" : "closed";
      const confirmed = mouthConfirmedOpen ? "open" : "closed";

      if (desired === confirmed) {
        pendingState = null;
        return;
      }

      if (pendingState !== desired) {
        pendingState = desired;
        pendingSince = perfNow;
        return;
      }

      if (perfNow - pendingSince >= STABLE_MS) {
        pendingState = null;
        if (desired === "open") {
          confirmMouthOpen(perfNow);
        } else {
          confirmMouthClosed(perfNow);
        }
      }
    }

    function confirmMouthOpen(perfNow) {
      mouthConfirmedOpen = true;
      mouthBadge.textContent = "嘴巴：張開";
      mouthBadge.className = "badge open";

      if (!isRecording || currentOpenEpisode) return;

      const startSec = (perfNow - recordStartPerf) / 1000;

      currentOpenEpisode = {
        startPerf: perfNow,
        startSec,
        // 張開確認時拍一張；閉上後再補上文字，並存成最終照片。
        rawPhotoCanvas: captureCurrentFrame()
      };

      statusEl.textContent =
        `偵測到嘴巴張開：${fmtMMSS(startSec)}，已拍攝照片。`;
    }

    function confirmMouthClosed(perfNow) {
      mouthConfirmedOpen = false;
      mouthBadge.textContent = "嘴巴：閉上";
      mouthBadge.className = "badge closed";

      if (!isRecording || !currentOpenEpisode) return;
      finishCurrentEpisode(perfNow);
    }

    function captureCurrentFrame() {
      const vw = camera.videoWidth || 720;
      const vh = camera.videoHeight || 1280;

      const c = document.createElement("canvas");
      c.width = vw;
      c.height = vh;
      const ctx = c.getContext("2d");

      if (facingMode === "user") {
        ctx.translate(vw, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(camera, 0, 0, vw, vh);
      return c;
    }

    function finishCurrentEpisode(endPerf) {
      const ep = currentOpenEpisode;
      currentOpenEpisode = null;

      const endSec = Math.max(ep.startSec, (endPerf - recordStartPerf) / 1000);
      const duration = Math.max(0, endSec - ep.startSec);

      ep.endPerf = endPerf;
      ep.endSec = endSec;
      ep.duration = duration;
      ep.finalCanvas = makeAnnotatedPhoto(ep);

      openTotalSeconds += duration;
      episodes.push(ep);

      openTotalEl.textContent = fmtSec(openTotalSeconds);
      openCountEl.textContent = String(episodes.length);
      addEpisodeToGallery(ep);

      statusEl.textContent =
        `已完成第 ${episodes.length} 次：${fmtMMSS(ep.startSec)} ～ ${fmtMMSS(ep.endSec)}，共 ${fmtSec(duration)} 秒。`;
    }

    function makeAnnotatedPhoto(ep) {
      const src = ep.rawPhotoCanvas;
      const barH = Math.max(110, Math.round(src.height * 0.13));

      const c = document.createElement("canvas");
      c.width = src.width;
      c.height = src.height + barH;

      const ctx = c.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(src, 0, 0);

      const pad = Math.max(20, Math.round(c.width * 0.025));
      const mainSize = Math.max(26, Math.round(c.width * 0.035));
      const subSize = Math.max(23, Math.round(c.width * 0.03));

      ctx.fillStyle = "#fff";
      ctx.textBaseline = "top";
      ctx.font = `700 ${mainSize}px system-ui, sans-serif`;
      ctx.fillText(
        `${fmtMMSS(ep.startSec)} ～ ${fmtMMSS(ep.endSec)}`,
        pad,
        src.height + Math.round(barH * 0.18)
      );

      ctx.fillStyle = "#c8d2de";
      ctx.font = `600 ${subSize}px system-ui, sans-serif`;
      ctx.fillText(
        `總張開秒數：${fmtSec(ep.duration)} 秒`,
        pad,
        src.height + Math.round(barH * 0.56)
      );

      return c;
    }

    function addEpisodeToGallery(ep) {
      const card = document.createElement("div");
      card.className = "shot";

      const img = document.createElement("img");
      img.src = ep.finalCanvas.toDataURL("image/jpeg", 0.92);

      const caption = document.createElement("div");
      caption.className = "caption";
      caption.textContent =
        `${fmtMMSS(ep.startSec)} ～ ${fmtMMSS(ep.endSec)}｜${fmtSec(ep.duration)} 秒`;

      card.append(img, caption);
      gallery.appendChild(card);
    }

    function resetSession() {
      recordStartPerf = performance.now();
      recordEndPerf = recordStartPerf;
      episodes = [];
      openTotalSeconds = 0;
      accumulatedOpenMs = 0;
      lastRatioSamplePerf = 0;
      currentOpenEpisode = null;

      // 以「本次開始」為新狀態基準，避免上一輪狀態殘留。
      mouthConfirmedOpen = false;
      pendingState = null;

      gallery.innerHTML = "";
      openTotalEl.textContent = "0.00";
      openCountEl.textContent = "0";
      recordTimeEl.textContent = "00:00";
      updateRatioBar();
      result.classList.remove("show");
      recordsPanel.classList.remove("show");
      if (autoStopTimerId) {
        clearTimeout(autoStopTimerId);
        autoStopTimerId = null;
      }

      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      resultVideo.removeAttribute("src");
      downloadVideo.removeAttribute("href");
    }

    function startRecording() {
      if (!faceLandmarker || !stream) {
        statusEl.textContent = "相機或 MediaPipe 尚未就緒。";
        return;
      }

      resetSession();
      isRecording = true;
      lastRatioSamplePerf = recordStartPerf;
      accumulatedOpenMs = 0;
      updateRatioBar(recordStartPerf);
      beep(180, 880);
      updateDurationButtons();

      startBtn.textContent = "結束";
      startBtn.classList.add("stop");

      timerId = setInterval(() => {
        const now = performance.now();
        recordTimeEl.textContent = fmtMMSS(nowRelativeSeconds(now));
        updateRatioBar(now);
      }, 200);

      statusEl.textContent =
        `記錄中：偵測時間 ${selectedDurationMinutes} 分鐘；jawOpen > ${OPEN_THRESHOLD.toFixed(2)} 即算張開。`;

      autoStopTimerId = setTimeout(() => {
        if (isRecording) {
          statusEl.textContent = `已達 ${selectedDurationMinutes} 分鐘，正在自動停止…`;
          stopRecording(true);
        }
      }, selectedDurationMinutes * 60 * 1000);
    }

    async function stopRecording(autoStopped = false) {
      if (!isRecording) return;

      const stopPerf = performance.now();

      // 若按下結束時嘴巴仍在張開，將「結束」時間視為本次閉合點。
      if (currentOpenEpisode) {
        finishCurrentEpisode(stopPerf);
      }

      updateRatioBar(stopPerf);
      recordEndPerf = stopPerf;
      isRecording = false;
      lastRatioSamplePerf = 0;
      beep(220, 660);

      if (autoStopTimerId) {
        clearTimeout(autoStopTimerId);
        autoStopTimerId = null;
      }

      clearInterval(timerId);
      timerId = null;

      startBtn.disabled = true;
      switchBtn.disabled = true;
      startBtn.textContent = "產生影片中…";
      recordTimeEl.textContent = fmtMMSS((recordEndPerf - recordStartPerf) / 1000);

      try {
        await buildSummaryVideo();
      } catch (err) {
        console.error(err);
        statusEl.textContent =
          "影片產生失敗；照片紀錄仍保留。此瀏覽器可能不支援 Canvas 錄影。";
      } finally {
        startBtn.disabled = false;
        switchBtn.disabled = false;
        startBtn.textContent = "開始";
        startBtn.classList.remove("stop");
        updateDurationButtons();
        if (autoStopped) {
          statusEl.textContent += `（已達 ${selectedDurationMinutes} 分鐘，自動停止）`;
        }
      }
    }

    async function toggleRecording() {
      if (isRecording) {
        await stopRecording();
      } else {
        startRecording();
      }
    }

    function chooseRecordingMime() {
      if (!window.MediaRecorder) return null;
      const candidates = [
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      return candidates.find(t => MediaRecorder.isTypeSupported(t)) || "";
    }

    function drawCover(ctx, img, x, y, w, h) {
      const sw = img.width;
      const sh = img.height;
      const scale = Math.max(w / sw, h / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = x + (w - dw) / 2;
      const dy = y + (h - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    async function buildSummaryVideo() {
      const totalRecordSec = Math.max(
        0.001,
        (recordEndPerf - recordStartPerf) / 1000
      );
      const ratio = openTotalSeconds / totalRecordSec;
      const ratioText =
        `${fmtSec(openTotalSeconds)} / ${fmtSec(totalRecordSec)} = ${(ratio * 100).toFixed(1)}%`;

      videoSummary.textContent =
        `本次嘴巴張開總秒數 / 本次記錄總秒數 = ${ratioText}`;

      if (episodes.length === 0) {
        result.classList.add("show");
        statusEl.textContent = "本次沒有偵測到完整的嘴巴張開事件，因此沒有可合成的照片。";
        return;
      }

      if (!videoCanvas.captureStream || !window.MediaRecorder) {
        throw new Error("MediaRecorder 或 canvas.captureStream 不支援");
      }

      const W = 720;
      const H = 960;
      const headerH = 110;
      videoCanvas.width = W;
      videoCanvas.height = H;

      const ctx = videoCanvas.getContext("2d");
      const fps = 30;
      const stream = videoCanvas.captureStream(fps);
      const mimeType = chooseRecordingMime();

      const recorder = mimeType
        ? new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 4_000_000 })
        : new MediaRecorder(stream, { videoBitsPerSecond: 4_000_000 });

      const chunks = [];
      recorder.ondataavailable = e => {
        if (e.data && e.data.size) chunks.push(e.data);
      };

      const stopped = new Promise((resolve, reject) => {
        recorder.onstop = resolve;
        recorder.onerror = e => reject(e.error || e);
      });

      recorder.start();

      const drawFrame = (canvas) => {
        ctx.fillStyle = "#080a0d";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 27px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
          `本次嘴巴張開總秒數 / 本次記錄總秒數 =`,
          W / 2,
          34
        );

        ctx.fillStyle = "#b9c5d3";
        ctx.font = "700 28px system-ui, sans-serif";
        ctx.fillText(ratioText, W / 2, 76);

        drawCover(ctx, canvas, 0, headerH, W, H - headerH);
      };

      // 每張照片停留 1 秒。
      for (const ep of episodes) {
        const start = performance.now();
        while (performance.now() - start < 1000) {
          drawFrame(ep.finalCanvas);
          await new Promise(r => requestAnimationFrame(r));
        }
      }

      recorder.stop();
      await stopped;
      stream.getTracks().forEach(t => t.stop());

      const actualType = recorder.mimeType || mimeType || "video/webm";
      const blob = new Blob(chunks, { type: actualType });

      videoObjectUrl = URL.createObjectURL(blob);
      resultVideo.src = videoObjectUrl;
      downloadVideo.href = videoObjectUrl;

      const ext = actualType.includes("mp4") ? "mp4" : "webm";
      downloadVideo.download = `mouth-open-summary.${ext}`;

      result.classList.add("show");
      statusEl.textContent =
        `完成：共 ${episodes.length} 張照片，影片約 ${episodes.length} 秒。`;
    }

    async function detectLoop() {
      if (faceLandmarker && camera.readyState >= 2) {
        try {
          if (camera.currentTime !== lastVideoTime) {
            lastVideoTime = camera.currentTime;

            const perfNow = performance.now();
            const result = faceLandmarker.detectForVideo(camera, perfNow);
            const jawResult = getJawOpenScore(result);
            const score = jawResult?.score ?? null;

            if (isRecording) updateRatioBar(perfNow);

            if (score == null) {
              scoreBadge.textContent = "jawOpen --";
              mouthBadge.textContent = "嘴巴：未偵測";
              mouthBadge.className = "badge closed";
              pendingState = null;

              // 開發者工具可查看 MediaPipe 是否真的有輸出 blendshapes。
              if (result?.faceLandmarks?.length) {
                console.debug("Face detected, but jawOpen score unavailable:", result?.faceBlendshapes);
              }
            } else {
              scoreBadge.textContent =
                `jawOpen ${Number(score).toFixed(2)}${jawResult?.source === "landmark" ? " · L" : ""}`;
              const rawOpen = score > OPEN_THRESHOLD;

              if (!isRecording) {
                mouthBadge.textContent = rawOpen ? "嘴巴：張開" : "嘴巴：閉上";
                mouthBadge.className = rawOpen ? "badge open" : "badge closed";
              } else {
                updateMouthState(rawOpen, perfNow);
              }
            }
          }
        } catch (err) {
          console.error("detectForVideo error:", err);
        }
      }

      requestAnimationFrame(detectLoop);
    }

    startBtn.addEventListener("click", toggleRecording);
    switchBtn.addEventListener("click", switchCamera);

    jawSlider.addEventListener("input", () => {
      OPEN_THRESHOLD = Number(jawSlider.value);
      jawValue.textContent = OPEN_THRESHOLD.toFixed(2);

      if (isRecording) {
        statusEl.textContent =
          `記錄中：偵測時間 ${selectedDurationMinutes} 分鐘；jawOpen > ${OPEN_THRESHOLD.toFixed(2)} 即算張開。`;
      } else {
        statusEl.textContent =
          `JawOpen 門檻已調整為 ${OPEN_THRESHOLD.toFixed(2)}。`;
      }
    });

    durationButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        if (isRecording) return;
        selectedDurationMinutes = Number(btn.dataset.minutes);
        updateDurationButtons();
        startRecording();
      });
    });

    viewRecordsBtn.addEventListener("click", () => {
      renderRecords();
      recordsPanel.classList.toggle("show");
      if (recordsPanel.classList.contains("show")) {
        recordsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    closeRecordsBtn.addEventListener("click", () => {
      recordsPanel.classList.remove("show");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && isRecording) {
        statusEl.textContent = "頁面進入背景，手機瀏覽器可能暫停相機或偵測。";
      }
    });

    updateDurationButtons();
    initMediaPipe();
  </script>
</body>
</html>
